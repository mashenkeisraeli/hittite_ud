<style>
  .interactive > .FORM,
  .interactive > .LEMMA,
  .interactive > .UPOS,
  .interactive > .DEPREL {
    cursor: pointer;
  }
  
  .FORM {
    font-size: 16px;
    z-index: 99;
  }
  
  .LEMMA {
    font-size: 13px;
    font-style: italic;
  }
  
  .UPOS, .XPOS {
    font: 11px DejaVu Sans;
  }
  
  .XPOS {
